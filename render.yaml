# Render Blueprint: one Docker web service plus a Postgres database.
services:
  - type: web
    name: ballpark
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ballpark-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: ballpark-db
    plan: free
